name: SonarCloud Analysis

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 6am UTC
  workflow_dispatch: # Manual trigger

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        # Vitest and its coverage provider are npm devDependencies; this job
        # needs no other toolchain (it previously installed only Deno).
        run: npm ci

      - name: Materialize committed WASM binaries for tests
        # Tests run against the committed build/*.wasm (module-loader.ts
        # resolves build/taglib-web.wasm for the Emscripten backend). The
        # WASI half of every parity test additionally requires
        # dist/wasi/taglib-wasi.wasm (tests/backend-adapter.ts HAS_WASI);
        # without it those instances silently skip and the coverage feed
        # measures only the Emscripten path. No build needed: the freshness
        # gate in ci.yml keeps the committed binaries current.
        run: |
          mkdir -p dist/wasi
          cp build/taglib-wasi.wasm dist/wasi/taglib-wasi.wasm

      - name: Run tests with coverage
        # tests/ and src/ both contain test files; the local gate runs both, so
        # the coverage feed must too. Coverage should go UP (cheap, dense unit
        # tests); verified on branch before merge. --expose-gc comes from
        # vite.config.ts `test.execArgv`. `test:sonar` sets SONAR_REPORT=1,
        # which adds vitest-sonar-reporter (the test-count feed) on top of the
        # reporters every other run uses. Vitest's v8/lcov reporter writes
        # coverage/lcov.info directly — no report conversion step is needed,
        # and the paths in it are already repository-relative.
        run: npm run test:sonar

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Test-cost metrics come from vitest-sonar-reporter's Generic Test
          # Data report (root <testExecutions>, one <file> per test file, one
          # <testCase> per test). Vitest's own JUnit reporter emits
          # <testsuites>, which this property rejects, which is why the report
          # is produced by a separate reporter rather than by junit.xml.
          # Coverage continues to flow via lcov below.
          args: >
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.testExecutionReportPaths=sonar-report.xml
