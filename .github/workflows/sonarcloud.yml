name: SonarCloud Analysis

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 6am UTC
  workflow_dispatch: # Manual trigger

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.1"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.3

      - name: Build Wasm
        # Emscripten-only: this job installs emsdk but not the WASI SDK.
        run: deno task build:wasm:emscripten

      - name: Run tests with coverage
        # tests/ and src/ both contain colocated unit tests; the local gate
        # runs both, so the coverage feed must too. Coverage should go UP
        # (cheap, dense unit tests); verified on branch before merge.
        # --v8-flags=--expose-gc: tests/auto-dispose.test.ts requires it.
        run: deno test --allow-read --allow-write --allow-env --coverage=coverage --v8-flags=--expose-gc tests/ src/

      - name: Generate coverage report
        run: |
          deno coverage coverage --lcov --output=coverage.lcov
          sed -i 's|SF:/home/.*/TagLib-Wasm/|SF:|g' coverage.lcov || true
          mkdir -p coverage
          mv coverage.lcov coverage/lcov.info

      - name: Generate test execution report
        run: |
          ./scripts/generate-sonar-test-report.ts || echo "Failed to generate test report"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.testExecutionReportPaths=test-results-sonar.xml
