name: Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_wasi:
        description: "Skip WASI build"
        required: false
        default: false
        type: boolean

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          # Cache only the npm download cache, not node_modules itself:
          # node_modules contains Deno-managed junctions (nodeModulesDir: auto),
          # and restoring a stale tree on Windows breaks `deno test` with
          # "failed to create junction ... (os error 183)".
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Check formatting
        run: deno fmt --check

      - name: Run linter
        run: deno lint

      - name: Run ESLint (typescript-eslint)
        run: npm run lint:ts

      - name: Type check
        run: deno check ./src ./tests

      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.45.1

      - name: Verify docs coverage of public exports
        # Local-only gate made mandatory: flags a shipped export that no doc
        # mentions (name-mention check, not accuracy). A guard that does not
        # run in CI is decoration — the same rule as the ast-grep step above.
        run: deno task docs:coverage

      - name: Verify no unused exports or dependencies (knip)
        # Local-only gate made mandatory: dead exports and orphaned deps rot
        # silently otherwise. knip is pinned in devDependencies and the task
        # uses --no-install, so the analyzed version is deterministic rather
        # than whatever npx would fetch.
        run: deno task knip

      - name: Verify toolchain pins agree across files
        # The wasm freshness gates byte-compare fresh builds against the
        # committed binaries, so a toolchain bump that misses one pin (three
        # workflow files + build/setup-dev-env.sh for emsdk; ci.yml + setup
        # scripts for wasi-sdk/binaryen) reds the pipeline with a confusing
        # "binary is stale" error. This fails fast at the pins instead; also
        # runs in the local check:all gate.
        run: bash scripts/check-toolchain-pins.sh

  bundle:
    name: Bundle (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      # Bundle the TS entry points with esbuild (~3s, no Emscripten/WASI). Use
      # the Deno task (deno run scripts/build-js.mjs), NOT `npm run build:ts`:
      # the npm script also runs `tsc`, which fails in a fresh checkout because
      # dist/taglib-wrapper.js (a wasm-build artifact) is absent. esbuild
      # externalizes that wrapper and hard-fails on any unresolvable bare
      # specifier in the browser entries, so this still catches
      # bundler-resolution regressions (e.g. a JSR import that isn't an npm dep)
      # without the multi-minute build-embind job. See taglib-uo1.
      - name: Build TypeScript bundles
        run: deno task build:ts

      - name: Verify disc-folder entry stays Wasm-free
        # taglib-cd7b: the disc-folder subpath is DECLARED dependency-free so
        # clients (tuneup) can import discFolderInfo without a wasm runtime.
        # esbuild's metafile lists every resolved module in the graph; anything
        # outside the exact pure allowlist is a regression of that contract.
        # The re-bundle must also byte-match the artifact build-js.mjs shipped
        # to dist/ moments ago — otherwise the guard would police a parallel
        # build while the real bundle regressed.
        run: |
          set -euo pipefail
          npx esbuild disc-folder.ts --bundle --format=esm --platform=neutral \
            --outfile=/tmp/disc-folder-bundle.js \
            --metafile=/tmp/disc-folder-meta.json
          if ! cmp -s /tmp/disc-folder-bundle.js dist/disc-folder.js; then
            echo "::error::disc-folder bundle diverged from build-js.mjs output (taglib-cd7b)"
            exit 1
          fi
          STRAY="$(
            jq -r '.inputs | keys[]' /tmp/disc-folder-meta.json \
              | grep -vE '^(disc-folder\.ts|src/folder-api/(album-types|album-grouping|album-identity|album-discs|album-corroborate|folder-disc)\.ts|src/utils/path\.ts)$' \
              || true
          )"
          if [ -n "$STRAY" ]; then
            echo "::error::disc-folder.ts pulled non-pure imports (taglib-cd7b):"
            printf '%s\n' "$STRAY"
            exit 1
          fi
          echo ":: disc-folder entry Wasm-free: $(jq -r '.inputs | length' /tmp/disc-folder-meta.json) modules, matches dist/"

      - name: Verify JSR publish ships no stray C++/CMake
        # taglib-asy: deno.json publish.exclude statically blocks CMakeLists.txt
        # / *.cmake / taglib/ / bindings/, but nothing proved it on every PR —
        # the taglib-qrp subtree island shipped ~88 C++/CMake files to JSR
        # because the list was incomplete. This step dry-runs the publish and
        # fails on any .cpp/.cmake outside the legit src/capi/ C shim, or any
        # CMakeLists.txt / *.cmake / taglib/ / bindings/ entry at all.
        # The dry-run lists files on stderr as `   file://<abs> (size)` and
        # ABORTS on uncommitted changes — fail closed on that abort instead of
        # silently passing on an empty list.
        run: |
          set -euo pipefail
          ROOT="${GITHUB_WORKSPACE:-$(pwd)}"
          DRYRUN="$(deno publish --dry-run 2>&1 || true)"
          if printf '%s\n' "$DRYRUN" | grep -q '^error:'; then
            echo "::error::deno publish --dry-run failed (uncommitted changes or config):"
            printf '%s\n' "$DRYRUN" | tail -5
            exit 1
          fi
          STRAY="$(
            printf '%s\n' "$DRYRUN" \
              | sed -n 's|^   file://||p' \
              | sed 's/ ([0-9.]*[KMG]*B)$//' \
              | sed "s|^$ROOT/||" \
              | grep -v '^src/capi/' \
              | grep -E '(\.cpp|\.cmake(\.in)?|CMakeLists\.txt)$|^(taglib/|bindings/)' \
              || true
          )"
          if [ -n "$STRAY" ]; then
            echo "::error::JSR publish would ship stray C++/CMake files (fix deno.json publish.exclude):"
            printf '%s\n' "$STRAY"
            exit 1
          fi

  test-capi-cpp:
    name: Test (C API C++ unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Run C++ unit tests
        run: bash tests/run-capi-tests.sh

  build-embind:
    name: Build (Embind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          # Cache only the npm download cache, not node_modules itself:
          # node_modules contains Deno-managed junctions (nodeModulesDir: auto),
          # and restoring a stale tree on Windows breaks `deno test` with
          # "failed to create junction ... (os error 183)".
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.8

      - name: Build WebAssembly
        # Emscripten-only by design: this job installs emsdk but not the WASI
        # SDK. The WASI backend is built by the separate build-wasi job.
        run: npm run build:wasm:emscripten

      # Byte-compare freshness gate (taglib-peml): build-wasm.sh pins
      # BINARYEN_ROOT to emsdk's vendored Binaryen, so the fresh rebuild must
      # be byte-identical to the committed binary. Comment-only C++ edits
      # produce identical bytes and pass.
      - name: Verify committed Emscripten binary is fresh
        run: |
          if ! git diff --quiet -- build/taglib-web.wasm; then
            echo "::error::build/taglib-web.wasm is stale — the fresh build differs from the committed binary."
            echo "Rebuild with 'deno task build:wasm' (both backends) or 'deno task build:wasm:emscripten',"
            echo "then commit the updated binary."
            git diff --stat -- build/taglib-web.wasm
            exit 1
          fi
          echo "build/taglib-web.wasm matches the fresh build"

      # Hard gate: the Emscripten wasm must actually instantiate on Deno. The
      # unit suite skips the Emscripten backend on load-failure (so a broken
      # wasm stays green); this fails the build instead. Catches wasm/glue
      # import-module mismatches (the 1.4.1 "./a" regression) before publish.
      - name: Emscripten smoke test (must instantiate on Deno)
        run: deno run --allow-read --allow-env scripts/smoke-emscripten.ts

      - name: WASI smoke test (must instantiate on Deno)
        run: deno run --allow-read --allow-env scripts/smoke-wasi.ts

      - name: Copy WASM files to dist
        run: |
          mkdir -p dist
          cp build/taglib-web.wasm dist/
          cp build/taglib-wrapper.js dist/
          cp build/taglib-wrapper.d.ts dist/

      - name: Build TypeScript
        run: npm run build:ts

      - name: Run postbuild
        run: npm run postbuild

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: embind-build
          path: |
            dist/
            build/taglib-web.wasm
            build/taglib-wrapper.js
            build/taglib-wrapper.d.ts

  build-wasi:
    name: Build (WASI)
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_wasi }}
    env:
      # Single source for the SDK version in this job: cache path/key and the
      # setup step below all read it, so a bump edits one line (the
      # scripts/check-toolchain-pins.sh guard keeps it in sync with the other
      # files that pin wasi-sdk).
      # Quoted on purpose: unquoted, 33.0 parses as a YAML float and the
      # runner stringifies it to "33", which breaks the download URL.
      WASI_VERSION: "33.0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # ~100MB tarball from GitHub Releases on every run: cache the unpacked
      # SDK so a transient download failure (429/503) can't red the pipeline,
      # and cache hits skip the download entirely. A version bump is a clean
      # miss (exact key, no restore-keys).
      - name: Cache WASI SDK
        uses: actions/cache@v5
        with:
          path: build/wasi-sdk/wasi-sdk-${{ env.WASI_VERSION }}-x86_64-linux
          key: ${{ runner.os }}-wasi-sdk-${{ env.WASI_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup WASI SDK
        run: |
          set -euo pipefail
          WASI_SDK_DIR="$(pwd)/build/wasi-sdk/wasi-sdk-${WASI_VERSION}-x86_64-linux"
          if [ ! -x "$WASI_SDK_DIR/bin/clang++" ]; then
            echo "Downloading WASI SDK ${WASI_VERSION}..."
            mkdir -p build/wasi-sdk
            cd build/wasi-sdk
            WASI_URL="https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION%%.*}/wasi-sdk-${WASI_VERSION}-x86_64-linux.tar.gz"
            # Retry: GitHub release downloads from hosted runners occasionally
            # 429/503; a transient fetch failure must not red the pipeline.
            for attempt in 1 2 3; do
              if curl -fL --retry 3 --retry-delay 5 --retry-all-errors -o wasi-sdk.tar.gz "$WASI_URL" \
                  && tar xf wasi-sdk.tar.gz; then
                rm -f wasi-sdk.tar.gz
                break
              fi
              echo "::warning::WASI SDK download attempt ${attempt} failed; retrying in 5s"
              sleep 5
            done
            if [ ! -x "$WASI_SDK_DIR/bin/clang++" ]; then
              echo "::error::Failed to download WASI SDK ${WASI_VERSION} (3 attempts)"
              exit 1
            fi
          else
            echo "WASI SDK ${WASI_VERSION} present (cache hit)"
          fi
          echo "WASI_SDK_PATH=$WASI_SDK_DIR" >> "$GITHUB_ENV"
          echo "$WASI_SDK_DIR/bin" >> "$GITHUB_PATH"

      - name: Install wasm-opt (binaryen) and ninja
        # binaryen is pinned at 132.0.0 — the same version as emsdk 6.0.8's
        # vendored Binaryen — so the WASI rebuild is byte-deterministic and
        # the freshness compare below is meaningful (taglib-peml).
        run: |
          npm install -g binaryen@132.0.0
          # ninja-build ships on ubuntu-latest images; apt is only a fallback
          # so a runner-image change never hard-fails on a package fetch.
          if ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get install -y ninja-build
          fi

      # WASI SDK 33's stock sysroot ships C++ exceptions (eh/ multilib), so the
      # previous custom EH-sysroot build (build-eh-sysroot.sh) is no longer
      # needed — build-wasi.sh links against the SDK's stock eh/ libs (taglib-sgh).

      - name: Cache WASI build
        uses: actions/cache@v5
        with:
          path: |
            build/wasi
          key: ${{ runner.os }}-wasi-${{ hashFiles('lib/taglib/**/*.cpp', 'lib/taglib/**/*.h', 'src/capi/**', 'build/build-wasi.sh') }}

      - name: Build with WASI SDK
        run: |
          chmod +x build/build-wasi.sh
          printf '#!/bin/bash\nexport WASI_SDK_PATH="%s"\nexport PATH="$WASI_SDK_PATH/bin:$PATH"\necho "WASI SDK environment configured"\n' "$WASI_SDK_PATH" > build/wasi-env.sh
          ./build/build-wasi.sh

      # Byte-compare freshness gate (taglib-peml): the fresh rebuild must be
      # byte-identical to the committed binary. This replaces the old
      # git-diff heuristic (wasm-freshness job) — it catches stale commits,
      # toolchain drift, and force-push artifacts equally, with zero
      # heuristics. Comment-only C++ edits produce identical bytes and pass.
      # NOTE: the WASI SDK's clang emits different bytes on macOS vs Linux
      # (same version), so the committed reference is the CI/Linux build —
      # download it from the wasi-fresh-reference artifact below.
      - name: Verify committed WASI binary is fresh
        run: |
          if ! git diff --quiet -- build/taglib-wasi.wasm; then
            echo "::error::build/taglib-wasi.wasm is stale — the fresh build differs from the committed binary."
            echo "Rebuild with 'deno task build:wasm' (both backends) or 'deno task build:wasm:wasi',"
            echo "then commit the updated binary."
            echo "For the CI/Linux reference build: download the 'wasi-fresh-reference' artifact"
            echo "from this run and commit dist/wasi/taglib-wasi.wasm as build/taglib-wasi.wasm."
            git diff --stat -- build/taglib-wasi.wasm
            exit 1
          fi
          echo "build/taglib-wasi.wasm matches the fresh build"

      - name: Upload fresh WASI binary (reference for the committed copy)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasi-fresh-reference
          path: dist/wasi/taglib-wasi.wasm

      - name: Verify WASI artifacts
        run: |
          ls -lah dist/wasi/
          file dist/wasi/taglib-wasi.wasm
          wc -c dist/wasi/taglib-wasi.wasm

      - name: Upload WASI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasi-build
          path: |
            dist/wasi/

  test:
    name: Test (${{ matrix.os }})
    needs: build-embind
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          # Cache only the npm download cache, not node_modules itself:
          # node_modules contains Deno-managed junctions (nodeModulesDir: auto),
          # and restoring a stale tree on Windows breaks `deno test` with
          # "failed to create junction ... (os error 183)".
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: embind-build
          path: .

      - name: Run tests
        # tests/ and src/ both contain colocated unit tests (CLAUDE.md T-1);
        # the local gate runs both, so CI must too — a guard that does not
        # run in CI is decoration (extra-state-registry.test.ts caught
        # _mp4ItemNames to no one). --v8-flags=--expose-gc: tests/
        # auto-dispose.test.ts requires it and fails loudly without it.
        run: deno test --allow-read --allow-write --allow-env --coverage=coverage --v8-flags=--expose-gc tests/ src/

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        run: deno coverage coverage --lcov --output=coverage.lcov

      - name: Upload coverage reports
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage.lcov

  test-wasi:
    name: Test (WASI)
    needs: build-wasi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Download WASI artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasi-build
          path: dist/wasi

      - name: Test the freshly built binary, not the committed one
        # The loader reads build/taglib-wasi.wasm (src/runtime/wasi-host-loader.ts,
        # src/runtime/unified-loader/module-loading.ts). Without this copy the job
        # downloaded the artifact and then tested the committed binary anyway,
        # so what build-wasi compiled was never executed — only size-reported.
        #
        # The committed binary still gets exercised: the main `test` job runs the
        # full suite, which defaults to the WASI backend. So `test` covers what
        # ships and this job covers what current source produces.
        run: |
          set -euo pipefail
          test -f dist/wasi/taglib-wasi.wasm
          cp dist/wasi/taglib-wasi.wasm build/taglib-wasi.wasm
          echo "Now testing freshly built WASI binary:"
          ls -l build/taglib-wasi.wasm

      - name: Run WASI tests
        run: |
          deno test --allow-read --allow-write --allow-env \
            tests/wasi-host.test.ts \
            tests/wasi-write-roundtrip.test.ts \
            tests/extended-write-roundtrip.test.ts \
            tests/security.test.ts

  package-compat:
    name: Package Compatibility
    needs: build-embind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: "latest" resolves via the oven-sh/bun refs/tags API on
          # every run, which 503s intermittently from Actions runners
          bun-version: 1.3.14

      - name: Install dependencies
        run: npm install

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: embind-build
          path: .

      - name: NPM - publint
        run: npx publint

      - name: NPM - arethetypeswrong
        run: |
          npx @arethetypeswrong/cli --pack --profile esm-only
          echo "Note: Using esm-only profile (CJS dynamic import warnings are expected)"

      - name: JSR - deno doc lint
        run: |
          # Check for missing documentation (warnings only, don't fail)
          deno doc --lint index.ts 2>&1 | head -50 || true
          echo ":: JSR documentation check complete"

      - name: Bun - import test
        run: |
          cd /tmp
          mkdir -p bun-compat-test
          cd bun-compat-test
          bun init -y
          bun add $GITHUB_WORKSPACE
          cat > test.ts << 'EOF'
          import { TagLib, readTags } from "taglib-wasm";
          import { readTags as simpleReadTags } from "taglib-wasm/simple";
          import { RatingUtils } from "taglib-wasm";
          import { discFolderInfo } from "taglib-wasm/disc-folder";

          if (typeof TagLib !== "function") throw new Error("TagLib export failed");
          if (typeof readTags !== "function") throw new Error("readTags export failed");
          if (typeof simpleReadTags !== "function") throw new Error("simple subpath export failed");
          if (typeof RatingUtils !== "object") throw new Error("RatingUtils export failed");
          if (discFolderInfo("CD1")?.number !== 1) throw new Error("disc-folder subpath export failed");

          console.log(":: Main exports resolve correctly");
          console.log(":: Simple subpath exports resolve correctly");
          EOF
          bun run test.ts
          echo ":: Bun compatibility verified"

      - name: Bun - integration tests
        run: |
          bun test tests/bun-integration.test.ts
          echo ":: Bun integration tests passed"

      - name: Node.js - import test
        run: |
          cd /tmp
          mkdir -p node-compat-test
          cd node-compat-test
          npm init -y
          npm pkg set type=module
          npm install $GITHUB_WORKSPACE
          cat > test.mjs << 'EOF'
          import { TagLib, readTags } from "taglib-wasm";
          import { readTags as simpleReadTags } from "taglib-wasm/simple";
          import { RatingUtils } from "taglib-wasm";
          import { discFolderInfo } from "taglib-wasm/disc-folder";

          if (typeof TagLib !== "function") throw new Error("TagLib export failed");
          if (typeof readTags !== "function") throw new Error("readTags export failed");
          if (typeof simpleReadTags !== "function") throw new Error("simple subpath export failed");
          if (typeof RatingUtils !== "object") throw new Error("RatingUtils export failed");
          if (discFolderInfo("CD1")?.number !== 1) throw new Error("disc-folder subpath export failed");

          console.log(":: Main exports resolve correctly");
          console.log(":: Simple subpath exports resolve correctly");
          EOF
          node test.mjs
          echo ":: Node.js compatibility verified"

      - name: Vite - browser bundle test
        run: |
          cd /tmp
          mkdir -p vite-compat-test
          cd vite-compat-test
          npm init -y
          npm pkg set type=module
          npm install $GITHUB_WORKSPACE
          npm install --save-dev vite

          cat > index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html><body><script type="module" src="/main.js"></script></body></html>
          HTMLEOF

          cat > main.js << 'JSEOF'
          import { TagLib, readTags } from "taglib-wasm";
          import { readTags as simpleReadTags } from "taglib-wasm/simple";
          import { RatingUtils } from "taglib-wasm";
          import { discFolderInfo } from "taglib-wasm/disc-folder";

          if (typeof TagLib !== "function") throw new Error("TagLib export failed");
          if (typeof readTags !== "function") throw new Error("readTags export failed");
          if (typeof simpleReadTags !== "function") throw new Error("simple subpath export failed");
          if (typeof RatingUtils !== "object") throw new Error("RatingUtils export failed");
          if (discFolderInfo("CD1")?.number !== 1) throw new Error("disc-folder subpath export failed");

          console.log("taglib-wasm browser imports OK");
          JSEOF

          npx vite build 2>&1
          echo ":: Vite build succeeded"

          # Check for server-only entry points in the bundle.
          # Note: node:fs/node:module refs from Emscripten's universal runtime are
          # expected (Vite externalizes them to empty shims). The real regression
          # signals are @wasmer/wasi-host imports, which mean Vite resolved the
          # server entry point instead of the browser one.
          if grep -rlE "@wasmer|wasi-host" dist/; then
            echo ":: Server-only imports found in Vite output bundle"
            exit 1
          fi
          echo ":: No server-only imports in browser bundle"

  size-report:
    name: Size Report
    needs: [build-wasi]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Download WASI artifacts
        if: needs.build-wasi.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: wasi-build
          path: wasi-build

      - name: Generate size report
        run: |
          echo "## Build Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Build | File | Size | Compressed (gzip) |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|------|-------------------|" >> $GITHUB_STEP_SUMMARY

          # WASI build
          if [ -f wasi-build/taglib-wasi.wasm ]; then
            WASI_SIZE_H=$(ls -lh wasi-build/taglib-wasi.wasm | awk '{print $5}')
            gzip -c wasi-build/taglib-wasi.wasm > /tmp/wasi.wasm.gz
            WASI_GZIP_H=$(ls -lh /tmp/wasi.wasm.gz | awk '{print $5}')
            echo "| WASI SDK | taglib-wasi.wasm | $WASI_SIZE_H | $WASI_GZIP_H |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| WASI SDK | _(skipped)_ | - | - |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Target Environments" >> $GITHUB_STEP_SUMMARY
          echo "- **Emscripten**: Browser, Node.js, Web Workers" >> $GITHUB_STEP_SUMMARY
          echo "- **WASI SDK**: Deno, Node.js (WASI), Cloudflare Workers" >> $GITHUB_STEP_SUMMARY

  summary:
    # Repository health report, not an enforced gate (2026-08-10): main branch
    # protection was tried with this job as the required check (taglib-wgz),
    # but required checks reject direct pushes to main (fresh commits can
    # never have a check), forcing a PR flow. Reverted to force-push/delete
    # protection only per workflow decision. If this should become binding
    # again, the ceremony-free path is a GitHub merge queue (merge_group
    # trigger + queue config), not required checks on direct pushes.
    name: Summary
    needs: [
      lint,
      bundle,
      build-embind,
      build-wasi,
      test,
      test-wasi,
      package-compat,
      size-report,
    ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Required jobs (must pass)
          FAILED=false
          for job in lint bundle build-embind test package-compat; do
            result="${{ needs.lint.result }}"
            case "$job" in
              lint) result="${{ needs.lint.result }}" ;;
              bundle) result="${{ needs.bundle.result }}" ;;
              build-embind) result="${{ needs.build-embind.result }}" ;;
              test) result="${{ needs.test.result }}" ;;
              package-compat) result="${{ needs.package-compat.result }}" ;;
            esac
            if [ "$result" != "success" ]; then
              echo "- **$job**: $result" >> $GITHUB_STEP_SUMMARY
              FAILED=true
            else
              echo "- **$job**: success" >> $GITHUB_STEP_SUMMARY
            fi
          done

          # Optional jobs (report but don't gate on skipped)
          for job in build-wasi test-wasi size-report; do
            case "$job" in
              build-wasi) result="${{ needs.build-wasi.result }}" ;;
              test-wasi) result="${{ needs.test-wasi.result }}" ;;
              size-report) result="${{ needs.size-report.result }}" ;;
            esac
            if [ "$result" = "failure" ]; then
              echo "- **$job**: failure" >> $GITHUB_STEP_SUMMARY
              FAILED=true
            else
              echo "- **$job**: $result" >> $GITHUB_STEP_SUMMARY
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "CI failed." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo ""
            echo "All checks passed." >> $GITHUB_STEP_SUMMARY
          fi
