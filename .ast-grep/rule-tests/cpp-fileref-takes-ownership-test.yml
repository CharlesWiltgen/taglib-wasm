id: cpp-fileref-takes-ownership
valid:
  # Ownership transferred explicitly — the shipped fix (taglib_embind.cpp:637).
  - fileRef = std::make_unique<TagLib::FileRef>(detected.release());
  # FileRef(IOStream*) does NOT take ownership (fileref.h:203), so .get() is
  # correct here. This is taglib_embind.cpp:605 and must stay unflagged.
  - fileRef = std::make_unique<TagLib::FileRef>(stream.get());
  # .get() into a non-owning consumer is unrelated to this rule.
  - detected.reset(new TagLib::MPEG::File(stream.get()));
  # The IOStream overload in declaration form, and under other spellings of the
  # same name — each must stay exempt or check:all fails on correct code.
  - TagLib::FileRef ok(stream.get());
  - auto r = std::make_unique<TagLib::FileRef>(ioStream.get());
  - auto r = std::make_unique<TagLib::FileRef>(byteStream.get());
invalid:
  # The taglib-f5hp double-free, verbatim from taglib_embind.cpp:627 at 64244626^.
  - fileRef = std::make_unique<TagLib::FileRef>(file.get());
  # Same defect via a differently-named owner — the rule must not be pinned to
  # one identifier, or the next occurrence under a new name ships unflagged.
  - fileRef = std::make_unique<TagLib::FileRef>(detected.get());
  # Unqualified and raw-new spellings of the same ownership mistake.
  - auto ref = std::make_unique<FileRef>(file.get());
  - auto *ref = new TagLib::FileRef(file.get());
  # Stack declaration — the most idiomatic spelling, and a different AST node
  # from the call form, so it went unflagged until it got its own pattern.
  - TagLib::FileRef ref(file.get());
  - FileRef ref(detected.get());
